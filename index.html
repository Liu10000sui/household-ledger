<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리우님의 가계부</title>
<style>
  :root{
    --bg1:#f6f2ff;
    --bg2:#ecfdf5;
    --bg3:#fff7ed;
    --card:#ffffff;
    --text:#17162b;
    --muted:#7b7a94;
    --border:#ece9f6;

    --green:#00c07a;
    --green-dk:#009a62;
    --orange:#ff7a18;
    --orange-dk:#ea580c;
    --purple:#8b2fe8;
    --purple-dk:#6d1fc0;
    --pink:#ff2d87;
    --blue:#2f7bff;
    --yellow:#ffc400;

    --income:var(--green);
    --expense:var(--orange);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:
      radial-gradient(1100px 520px at 8% -8%, #efe0ff 0%, rgba(239,224,255,0) 62%),
      radial-gradient(900px 480px at 100% 0%, #ffe6cc 0%, rgba(255,230,204,0) 60%),
      radial-gradient(900px 620px at 50% 115%, #ccffe9 0%, rgba(204,255,233,0) 62%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
    color:var(--text);
    padding:24px 18px 48px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;}

  /* ── 헤더 ── */
  .top-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  h1{
    font-size:27px;margin:0;font-weight:900;letter-spacing:-.8px;
    background:linear-gradient(95deg,var(--purple) 0%,var(--pink) 42%,var(--orange) 72%,var(--green) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1 .emo{-webkit-text-fill-color:initial;color:initial;}
  .file-actions{display:flex;gap:8px;}

  /* ── 카드 ── */
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 12px 34px -20px rgba(80,40,160,.45);
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:5px;
    background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange),var(--yellow),var(--green));
  }
  .section-title{
    font-size:15px;font-weight:800;margin:0 0 14px;display:flex;align-items:center;gap:8px;letter-spacing:-.3px;
  }
  .section-title .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dot.p{background:var(--purple);box-shadow:0 0 0 4px rgba(139,47,232,.15);}
  .dot.o{background:var(--orange);box-shadow:0 0 0 4px rgba(255,122,24,.15);}
  .dot.g{background:var(--green);box-shadow:0 0 0 4px rgba(0,192,122,.15);}
  .dot.b{background:var(--blue);box-shadow:0 0 0 4px rgba(47,123,255,.15);}
  .spacer{flex:1;}

  /* ── 히어로(월 이동 + 요약) ── */
  .hero{
    border-radius:24px;padding:22px;margin-bottom:20px;color:#fff;
    background:linear-gradient(125deg,#7b1fe0 0%,#b32ac0 34%,#ff4d6d 62%,#ff8a1e 100%);
    box-shadow:0 22px 48px -24px rgba(123,31,224,.85);
  }
  .month-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .month-nav button{
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;
    border-radius:12px;width:38px;height:38px;cursor:pointer;font-size:19px;line-height:1;
    font-family:inherit;transition:transform .15s, background .15s;
  }
  .month-nav button:hover{background:rgba(255,255,255,.34);transform:translateY(-2px);}
  .month-nav .month-label{font-size:21px;font-weight:900;min-width:150px;text-align:center;letter-spacing:-.5px;}
  .month-nav .today-btn{width:auto;padding:0 12px;font-size:13px;font-weight:700;}

  .summary{display:flex;gap:12px;flex-wrap:wrap;}
  .summary .box{
    flex:1;min-width:150px;border-radius:16px;padding:14px 16px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
    backdrop-filter:blur(6px);
  }
  .summary .box .label{font-size:12px;opacity:.92;margin-bottom:6px;font-weight:700;letter-spacing:.2px;}
  .summary .box .value{font-size:21px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
  .summary .box .sub{font-size:11px;opacity:.85;margin-top:4px;}

  /* ── 입력 폼 ── */
  form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--muted);font-weight:700;}
  .field input, .field select{
    padding:11px 12px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;
    background:#fdfcff;color:var(--text);font-family:inherit;transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus{
    outline:none;border-color:var(--purple);box-shadow:0 0 0 4px rgba(139,47,232,.14);
  }
  .field.memo{flex:1;min-width:170px;}
  .field.amount input{width:140px;}
  .type-toggle{display:flex;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:#fdfcff;}
  .type-toggle button{
    padding:10px 18px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:800;
    color:var(--muted);font-family:inherit;transition:.15s;
  }
  .type-toggle button.active[data-type="expense"]{background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;}
  .type-toggle button.active[data-type="income"]{background:linear-gradient(135deg,var(--green),#12b8a6);color:#fff;}

  .btn{
    padding:11px 20px;border:none;border-radius:12px;font-family:inherit;
    background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;
    cursor:pointer;font-size:14px;font-weight:800;
    box-shadow:0 10px 22px -12px rgba(139,47,232,.9);transition:transform .15s, box-shadow .15s, filter .15s;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06);}
  .btn.secondary{
    background:#fff;color:var(--purple-dk);border:1.5px solid #e6dcfb;box-shadow:none;font-weight:700;
  }
  .btn.secondary:hover{background:#f8f4ff;}
  .btn.small{padding:7px 12px;font-size:12px;border-radius:10px;}
  .btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);box-shadow:none;}

  /* ── 주차별 차트 ── */
  .chart-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700;}
  .chart-legend .key{display:flex;align-items:center;gap:6px;}
  .chart-legend .swatch{width:14px;height:10px;border-radius:3px;}
  .swatch.exp{background:linear-gradient(180deg,#ff8a1e,#ff2d87);}
  .swatch.inc{background:linear-gradient(180deg,#22d3a5,#00a06a);}
  .chart-box{width:100%;overflow:hidden;}
  .chart-box svg{width:100%;height:auto;display:block;}
  .chart-box svg rect.bar{transition:opacity .15s;}
  .chart-box svg rect.bar:hover{opacity:.78;}

  /* ── 달력 ── */
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .cal-head div{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:4px 0;}
  .cal-head div.sun{color:#ff2d87;}
  .cal-head div.sat{color:var(--blue);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-cell{
    min-height:92px;border:1.5px solid var(--border);border-radius:14px;padding:7px 7px 8px;
    background:#fdfcff;display:flex;flex-direction:column;gap:4px;cursor:pointer;
    transition:transform .12s, box-shadow .12s, border-color .12s;
  }
  .cal-cell.blank{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell:not(.blank):hover{transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(80,40,160,.8);border-color:#d9cdfa;}
  .cal-cell.today{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,47,232,.14);}
  .cal-cell.selected{border-color:var(--pink);background:#fff5fa;box-shadow:0 0 0 3px rgba(255,45,135,.18);}
  .cal-cell .dnum{font-size:13px;font-weight:800;color:var(--text);}
  .cal-cell .dnum.sun{color:#ff2d87;}
  .cal-cell .dnum.sat{color:var(--blue);}
  .cal-cell .bars{display:flex;flex-direction:column;gap:3px;margin-top:auto;}
  .cal-line{display:flex;flex-direction:column;gap:2px;}
  .band{height:7px;border-radius:99px;background:#f0edf8;overflow:hidden;}
  .band i{display:block;height:100%;border-radius:99px;}
  .band.inc i{background:linear-gradient(90deg,#22d3a5,#00a06a);}
  .band.exp i{background:linear-gradient(90deg,#ffb020,#ff2d87);}
  .band-amt{font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;letter-spacing:-.3px;}
  .band-amt.inc{color:var(--green-dk);}
  .band-amt.exp{color:var(--orange-dk);}

  /* ── 표 ── */
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:560px;}
  th{
    color:var(--muted);font-weight:800;font-size:11px;text-align:left;padding:4px 10px;letter-spacing:.4px;
  }
  td{padding:11px 10px;font-size:14px;white-space:nowrap;background:#fdfcff;border-top:1.5px solid var(--border);border-bottom:1.5px solid var(--border);}
  td:first-child{border-left:1.5px solid var(--border);border-radius:12px 0 0 12px;}
  td:last-child{border-right:1.5px solid var(--border);border-radius:0 12px 12px 0;}
  tr.income td:first-child{box-shadow:inset 4px 0 0 var(--green);}
  tr.expense td:first-child{box-shadow:inset 4px 0 0 var(--orange);}
  td.memo{white-space:normal;word-break:break-word;max-width:230px;}
  td.amount{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;}
  tr.income td.amount{color:var(--green-dk);}
  tr.expense td.amount{color:var(--orange-dk);}
  td.actions{text-align:right;white-space:nowrap;}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;}
  .pill.income{background:rgba(0,192,122,.14);color:var(--green-dk);}
  .pill.expense{background:rgba(255,122,24,.16);color:var(--orange-dk);}
  .pill.cat{background:rgba(139,47,232,.11);color:var(--purple-dk);}
  .empty{color:var(--muted);text-align:center;padding:28px 0;font-size:14px;font-weight:600;}

  /* ── 카테고리 ── */
  .cat-summary{display:flex;flex-direction:column;gap:10px;}
  .cat-row{display:flex;align-items:center;gap:10px;font-size:13px;}
  .cat-row .name{width:96px;flex-shrink:0;font-weight:700;}
  .cat-row .bar-bg{flex:1;background:#f2eefb;border-radius:99px;height:12px;overflow:hidden;}
  .cat-row .bar-fill{height:100%;border-radius:99px;transition:width .4s ease;}
  .cat-row .amt{width:118px;text-align:right;flex-shrink:0;font-weight:800;font-variant-numeric:tabular-nums;}
  .cat-row .pct{width:42px;text-align:right;flex-shrink:0;color:var(--muted);font-size:11px;font-weight:700;}

  #importFile{display:none;}
  .warning-banner{
    display:none;background:linear-gradient(135deg,#fff3c4,#ffe0b2);border:1.5px solid #ffc400;
    color:#8a5a00;padding:12px 16px;border-radius:14px;font-size:13px;margin-bottom:16px;font-weight:700;
  }
  .filter-note{
    display:none;align-items:center;gap:10px;background:#fff5fa;border:1.5px solid #ffd0e4;
    color:#b3145e;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:12px;flex-wrap:wrap;
  }

  @media (max-width:640px){
    body{padding:16px 12px 40px;}
    .card,.hero{padding:16px;border-radius:18px;}
    .cal-grid,.cal-head{gap:4px;}
    .cal-cell{min-height:74px;padding:5px;border-radius:11px;}
    .cal-cell .band-amt{font-size:9px;}
    .cal-head div{font-size:11px;}
    h1{font-size:22px;}
    .month-nav .month-label{font-size:18px;min-width:120px;}
    .cat-row{gap:7px;font-size:12px;}
    .cat-row .name{width:70px;}
    .cat-row .pct{width:32px;}
    .cat-row .amt{width:88px;font-size:12px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="warning-banner" id="storageWarning">
    이 브라우저 환경에서는 자동 저장이 되지 않습니다. 작업 내용은 "JSON 내보내기"로 꼭 백업해 주세요.
  </div>

  <div class="top-actions">
    <h1><span class="emo">💸</span> 리우님의 가계부</h1>
    <div class="file-actions">
      <button class="btn secondary small" id="exportBtn">JSON 내보내기</button>
      <button class="btn secondary small" id="importBtn">JSON 불러오기</button>
      <input type="file" id="importFile" accept="application/json">
    </div>
  </div>

  <div class="hero">
    <div class="month-nav">
      <button id="prevMonth" title="이전 달">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth" title="다음 달">›</button>
      <button id="todayBtn" class="today-btn" title="이번 달로 이동">오늘</button>
    </div>
    <div class="summary">
      <div class="box income">
        <div class="label">💚 이번 달 수입</div>
        <div class="value" id="totalIncome">0원</div>
        <div class="sub" id="incomeCount">0건</div>
      </div>
      <div class="box expense">
        <div class="label">🧡 이번 달 지출</div>
        <div class="value" id="totalExpense">0원</div>
        <div class="sub" id="expenseCount">0건</div>
      </div>
      <div class="box">
        <div class="label">💜 잔액</div>
        <div class="value" id="totalBalance">0원</div>
        <div class="sub" id="balanceSub">하루 평균 지출 0원</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><span class="dot p"></span><span id="formTitle">내역 추가</span></div>
    <form id="txForm">
      <div class="field">
        <label>구분</label>
        <div class="type-toggle">
          <button type="button" data-type="expense" class="active">지출</button>
          <button type="button" data-type="income">수입</button>
        </div>
      </div>
      <div class="field">
        <label>날짜</label>
        <input type="date" id="txDate" required>
      </div>
      <div class="field">
        <label>카테고리</label>
        <select id="txCategory"></select>
      </div>
      <div class="field memo">
        <label>내용</label>
        <input type="text" id="txMemo" placeholder="예: 점심 식사">
      </div>
      <div class="field amount">
        <label>금액</label>
        <input type="number" id="txAmount" min="0" step="1" placeholder="0" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">추가</button>
      <button type="button" class="btn ghost" id="cancelEditBtn" style="display:none;">취소</button>
    </form>
  </div>

  <div class="card">
    <div class="section-title">
      <span class="dot o"></span>주차별 지출 그래프
      <span class="spacer"></span>
      <span class="chart-legend">
        <span class="key"><span class="swatch exp"></span>지출</span>
        <span class="key"><span class="swatch inc"></span>수입</span>
      </span>
    </div>
    <div class="chart-box" id="weekChart"></div>
  </div>

  <div class="card">
    <div class="section-title">
      <span class="dot g"></span>달력
      <span class="spacer"></span>
      <span class="chart-legend">
        <span class="key"><span class="swatch inc"></span>수입 띠</span>
        <span class="key"><span class="swatch exp"></span>지출 띠</span>
      </span>
    </div>
    <div class="cal-head">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="card">
    <div class="section-title"><span class="dot o"></span>지출 카테고리별 합계</div>
    <div class="cat-summary" id="catSummary"></div>
  </div>

  <div class="card">
    <div class="section-title"><span class="dot b"></span><span id="listTitle">이번 달 내역</span></div>
    <div class="filter-note" id="filterNote">
      <span id="filterText"></span>
      <button class="btn secondary small" id="clearFilter">전체 보기</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>날짜</th><th>구분</th><th>카테고리</th><th>내용</th><th style="text-align:right;">금액</th><th></th></tr>
        </thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyMsg" style="display:none;">등록된 내역이 없습니다.</div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'ggb_transactions_v1';
  var CATEGORIES = {
    income: ['급여','용돈','상여','이자/배당','기타수입'],
    expense: ['식비','교통비','주거/관리비','통신비','의료/건강','문화/여가','교육','쇼핑','경조사','기타지출']
  };
  var CAT_COLORS = ['#8b2fe8','#ff2d87','#ff7a18','#ffc400','#00c07a','#2f7bff','#12b8a6','#e8309c','#7c5cff','#ff5252'];

  var state = {
    currentType: 'expense',
    editingId: null,
    viewDate: (function(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); })(),
    selectedDate: null
  };

  var storageOk = true;
  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      storageOk = false;
      return [];
    }
  }
  function saveData(list){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }catch(e){
      storageOk = false;
    }
    if(!storageOk){
      document.getElementById('storageWarning').style.display = 'block';
    }
  }
  var data = loadData();
  if(!storageOk){
    document.getElementById('storageWarning').style.display = 'block';
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }
  function fmtMoney(n){
    return Number(n).toLocaleString('ko-KR') + '원';
  }
  function fmtShort(n){
    n = Number(n);
    if(n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'') + '억';
    if(n >= 10000) return (n/10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/,'') + '만';
    if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + '천';
    return String(n);
  }
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function monthKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
  function ymdOf(dateStr){ return dateStr.slice(0,7); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function todayStr(){
    var n = new Date();
    return n.getFullYear()+'-'+pad2(n.getMonth()+1)+'-'+pad2(n.getDate());
  }

  var typeToggleEl = document.querySelector('.type-toggle');
  var categorySelect = document.getElementById('txCategory');
  var dateInput = document.getElementById('txDate');
  var memoInput = document.getElementById('txMemo');
  var amountInput = document.getElementById('txAmount');
  var form = document.getElementById('txForm');
  var submitBtn = document.getElementById('submitBtn');
  var cancelEditBtn = document.getElementById('cancelEditBtn');
  var formTitle = document.getElementById('formTitle');

  function refreshCategoryOptions(){
    var list = CATEGORIES[state.currentType];
    categorySelect.innerHTML = list.map(function(c){
      return '<option value="'+esc(c)+'">'+esc(c)+'</option>';
    }).join('');
  }

  typeToggleEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-type]');
    if(!btn) return;
    state.currentType = btn.getAttribute('data-type');
    Array.prototype.forEach.call(typeToggleEl.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b === btn);
    });
    refreshCategoryOptions();
  });

  function resetForm(){
    state.editingId = null;
    form.reset();
    dateInput.value = state.selectedDate || todayStr();
    state.currentType = 'expense';
    Array.prototype.forEach.call(typeToggleEl.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.getAttribute('data-type') === 'expense');
    });
    refreshCategoryOptions();
    submitBtn.textContent = '추가';
    formTitle.textContent = '내역 추가';
    cancelEditBtn.style.display = 'none';
  }

  cancelEditBtn.addEventListener('click', resetForm);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var amount = Number(amountInput.value);
    if(!dateInput.value || !amount || amount <= 0){
      alert('날짜와 올바른 금액을 입력해 주세요.');
      return;
    }
    if(state.editingId){
      var item = data.find(function(d){ return d.id === state.editingId; });
      if(item){
        item.date = dateInput.value;
        item.type = state.currentType;
        item.category = categorySelect.value;
        item.memo = memoInput.value.trim();
        item.amount = amount;
      }
    } else {
      data.push({
        id: uid(),
        date: dateInput.value,
        type: state.currentType,
        category: categorySelect.value,
        memo: memoInput.value.trim(),
        amount: amount
      });
    }
    saveData(data);
    resetForm();
    render();
  });

  function startEdit(id){
    var item = data.find(function(d){ return d.id === id; });
    if(!item) return;
    state.editingId = id;
    state.currentType = item.type;
    Array.prototype.forEach.call(typeToggleEl.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.getAttribute('data-type') === item.type);
    });
    refreshCategoryOptions();
    dateInput.value = item.date;
    categorySelect.value = item.category;
    memoInput.value = item.memo || '';
    amountInput.value = item.amount;
    submitBtn.textContent = '수정 완료';
    formTitle.textContent = '내역 수정';
    cancelEditBtn.style.display = 'inline-block';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function deleteItem(id){
    if(!confirm('이 내역을 삭제할까요?')) return;
    data = data.filter(function(d){ return d.id !== id; });
    saveData(data);
    if(state.editingId === id) resetForm();
    render();
  }

  function shiftMonth(delta){
    state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth() + delta, 1);
    state.selectedDate = null;
    render();
  }
  document.getElementById('prevMonth').addEventListener('click', function(){ shiftMonth(-1); });
  document.getElementById('nextMonth').addEventListener('click', function(){ shiftMonth(1); });
  document.getElementById('todayBtn').addEventListener('click', function(){
    var n = new Date();
    state.viewDate = new Date(n.getFullYear(), n.getMonth(), 1);
    state.selectedDate = null;
    render();
  });

  var txBody = document.getElementById('txBody');
  var emptyMsg = document.getElementById('emptyMsg');
  var monthLabel = document.getElementById('monthLabel');
  var catSummaryEl = document.getElementById('catSummary');
  var calGrid = document.getElementById('calGrid');
  var weekChartEl = document.getElementById('weekChart');
  var filterNote = document.getElementById('filterNote');
  var filterText = document.getElementById('filterText');
  var listTitle = document.getElementById('listTitle');

  /* ── 주차별 그래프 ── */
  function buildWeeks(year, month, monthItems){
    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var weekCount = Math.ceil((firstDow + daysInMonth) / 7);
    var weeks = [];
    for(var i = 0; i < weekCount; i++){
      var start = Math.max(1, i * 7 - firstDow + 1);
      var end = Math.min(daysInMonth, (i + 1) * 7 - firstDow);
      weeks.push({ label:(i+1)+'주', range:start+'~'+end+'일', income:0, expense:0 });
    }
    monthItems.forEach(function(d){
      var day = Number(d.date.slice(8,10));
      var idx = Math.floor((day - 1 + firstDow) / 7);
      if(!weeks[idx]) return;
      if(d.type === 'income') weeks[idx].income += d.amount;
      else weeks[idx].expense += d.amount;
    });
    return weeks;
  }

  function renderWeekChart(weeks){
    var hasData = weeks.some(function(w){ return w.income > 0 || w.expense > 0; });
    if(!hasData){
      weekChartEl.innerHTML = '<div class="empty">이번 달 내역이 없어 그래프를 표시할 수 없습니다.</div>';
      return;
    }
    var W = 700, H = 260, padL = 52, padR = 14, padT = 26, padB = 44;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var max = 0;
    weeks.forEach(function(w){ max = Math.max(max, w.expense, w.income); });
    if(max <= 0) max = 1;
    var groupW = plotW / weeks.length;
    var barW = Math.min(30, groupW * 0.28);
    var gap = 6;

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="주차별 수입 지출 그래프">';
    svg += '<defs>'+
      '<linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="#ff8a1e"/><stop offset="100%" stop-color="#ff2d87"/></linearGradient>'+
      '<linearGradient id="gInc" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="#22d3a5"/><stop offset="100%" stop-color="#00a06a"/></linearGradient>'+
      '</defs>';

    for(var g = 0; g <= 4; g++){
      var ratio = g / 4;
      var y = padT + plotH * (1 - ratio);
      svg += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+
             '" stroke="#ece9f6" stroke-width="1.5"/>';
      svg += '<text x="'+(padL-9)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#9b9ab0" font-weight="700">'+
             (ratio === 0 ? '0' : fmtShort(Math.round(max*ratio)))+'</text>';
    }

    weeks.forEach(function(w, i){
      var cx = padL + groupW * i + groupW / 2;
      var xe = cx - barW - gap/2;
      var xi = cx + gap/2;
      var he = w.expense > 0 ? Math.max(3, plotH * (w.expense / max)) : 0;
      var hi = w.income > 0 ? Math.max(3, plotH * (w.income / max)) : 0;

      if(he > 0){
        svg += '<rect class="bar" x="'+xe.toFixed(1)+'" y="'+(padT+plotH-he).toFixed(1)+'" width="'+barW.toFixed(1)+
               '" height="'+he.toFixed(1)+'" rx="6" fill="url(#gExp)">'+
               '<title>'+w.label+' ('+w.range+') 지출 '+fmtMoney(w.expense)+'</title></rect>';
        svg += '<text x="'+(xe+barW/2).toFixed(1)+'" y="'+(padT+plotH-he-7).toFixed(1)+
               '" text-anchor="middle" font-size="11" font-weight="800" fill="#ea580c">'+fmtShort(w.expense)+'</text>';
      }
      if(hi > 0){
        svg += '<rect class="bar" x="'+xi.toFixed(1)+'" y="'+(padT+plotH-hi).toFixed(1)+'" width="'+barW.toFixed(1)+
               '" height="'+hi.toFixed(1)+'" rx="6" fill="url(#gInc)">'+
               '<title>'+w.label+' ('+w.range+') 수입 '+fmtMoney(w.income)+'</title></rect>';
        svg += '<text x="'+(xi+barW/2).toFixed(1)+'" y="'+(padT+plotH-hi-7).toFixed(1)+
               '" text-anchor="middle" font-size="11" font-weight="800" fill="#009a62">'+fmtShort(w.income)+'</text>';
      }
      svg += '<text x="'+cx.toFixed(1)+'" y="'+(padT+plotH+20)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#17162b">'+w.label+'</text>';
      svg += '<text x="'+cx.toFixed(1)+'" y="'+(padT+plotH+35)+'" text-anchor="middle" font-size="10" fill="#9b9ab0">'+w.range+'</text>';
    });

    svg += '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'" stroke="#d9d5ea" stroke-width="2"/>';
    svg += '</svg>';
    weekChartEl.innerHTML = svg;
  }

  /* ── 달력 ── */
  function renderCalendar(year, month, monthItems){
    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var daily = {};
    monthItems.forEach(function(d){
      var day = Number(d.date.slice(8,10));
      if(!daily[day]) daily[day] = {income:0, expense:0};
      if(d.type === 'income') daily[day].income += d.amount;
      else daily[day].expense += d.amount;
    });
    // 수입 띠와 지출 띠는 각각의 최대값 기준으로 그린다.
    // (한쪽 금액이 크면 반대쪽 띠가 전부 눌려 보이는 것을 막기 위함)
    var maxIn = 0, maxOut = 0;
    Object.keys(daily).forEach(function(k){
      maxIn = Math.max(maxIn, daily[k].income);
      maxOut = Math.max(maxOut, daily[k].expense);
    });
    if(maxIn <= 0) maxIn = 1;
    if(maxOut <= 0) maxOut = 1;

    var today = todayStr();
    var html = '';
    for(var b = 0; b < firstDow; b++) html += '<div class="cal-cell blank"></div>';
    for(var day = 1; day <= daysInMonth; day++){
      var ds = year+'-'+pad2(month+1)+'-'+pad2(day);
      var dow = (firstDow + day - 1) % 7;
      var info = daily[day] || {income:0, expense:0};
      var cls = 'cal-cell';
      if(ds === today) cls += ' today';
      if(ds === state.selectedDate) cls += ' selected';
      var numCls = dow === 0 ? ' sun' : (dow === 6 ? ' sat' : '');

      html += '<div class="'+cls+'" data-date="'+ds+'" title="'+ds+
              (info.income ? ' / 수입 '+fmtMoney(info.income) : '')+
              (info.expense ? ' / 지출 '+fmtMoney(info.expense) : '')+'">';
      html += '<div class="dnum'+numCls+'">'+day+'</div>';
      html += '<div class="bars">';
      if(info.income > 0){
        html += '<div class="cal-line">'+
                  '<div class="band inc"><i style="width:'+Math.max(14, Math.round(info.income/maxIn*100))+'%"></i></div>'+
                  '<div class="band-amt inc">+'+fmtShort(info.income)+'</div>'+
                '</div>';
      }
      if(info.expense > 0){
        html += '<div class="cal-line">'+
                  '<div class="band exp"><i style="width:'+Math.max(14, Math.round(info.expense/maxOut*100))+'%"></i></div>'+
                  '<div class="band-amt exp">-'+fmtShort(info.expense)+'</div>'+
                '</div>';
      }
      html += '</div></div>';
    }
    calGrid.innerHTML = html;
  }

  calGrid.addEventListener('click', function(e){
    var cell = e.target.closest('.cal-cell[data-date]');
    if(!cell) return;
    var ds = cell.getAttribute('data-date');
    state.selectedDate = (state.selectedDate === ds) ? null : ds;
    if(state.selectedDate && !state.editingId) dateInput.value = state.selectedDate;
    render();
  });

  document.getElementById('clearFilter').addEventListener('click', function(){
    state.selectedDate = null;
    render();
  });

  /* ── 전체 렌더 ── */
  function render(){
    var year = state.viewDate.getFullYear();
    var month = state.viewDate.getMonth();
    var mk = monthKey(state.viewDate);
    monthLabel.textContent = year + '년 ' + (month + 1) + '월';

    var monthItems = data.filter(function(d){ return d && typeof d.date === 'string' && ymdOf(d.date) === mk; })
                         .sort(function(a,b){ return b.date.localeCompare(a.date); });

    var totalIncome = 0, totalExpense = 0, incomeCnt = 0, expenseCnt = 0;
    monthItems.forEach(function(d){
      if(d.type === 'income'){ totalIncome += d.amount; incomeCnt++; }
      else { totalExpense += d.amount; expenseCnt++; }
    });
    document.getElementById('totalIncome').textContent = fmtMoney(totalIncome);
    document.getElementById('totalExpense').textContent = fmtMoney(totalExpense);
    document.getElementById('totalBalance').textContent = fmtMoney(totalIncome - totalExpense);
    document.getElementById('incomeCount').textContent = incomeCnt + '건';
    document.getElementById('expenseCount').textContent = expenseCnt + '건';
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    document.getElementById('balanceSub').textContent =
      '하루 평균 지출 ' + fmtMoney(Math.round(totalExpense / daysInMonth));

    renderWeekChart(buildWeeks(year, month, monthItems));
    renderCalendar(year, month, monthItems);

    var listItems = monthItems;
    if(state.selectedDate){
      listItems = monthItems.filter(function(d){ return d.date === state.selectedDate; });
      var parts = state.selectedDate.split('-');
      filterNote.style.display = 'flex';
      filterText.textContent = Number(parts[1]) + '월 ' + Number(parts[2]) + '일 내역만 보는 중 (' + listItems.length + '건)';
      listTitle.textContent = Number(parts[1]) + '월 ' + Number(parts[2]) + '일 내역';
    } else {
      filterNote.style.display = 'none';
      listTitle.textContent = '이번 달 내역';
    }

    txBody.innerHTML = '';
    emptyMsg.style.display = listItems.length ? 'none' : 'block';
    emptyMsg.textContent = state.selectedDate ? '이 날짜에는 내역이 없습니다.' : '등록된 내역이 없습니다.';
    listItems.forEach(function(d){
      var tr = document.createElement('tr');
      tr.className = d.type;
      tr.innerHTML =
        '<td>'+esc(d.date)+'</td>'+
        '<td><span class="pill '+(d.type === 'income' ? 'income' : 'expense')+'">'+(d.type==='income' ? '수입' : '지출')+'</span></td>'+
        '<td><span class="pill cat">'+esc(d.category)+'</span></td>'+
        '<td class="memo">'+esc(d.memo || '-')+'</td>'+
        '<td class="amount">'+(d.type==='income'?'+':'-')+fmtMoney(d.amount)+'</td>'+
        '<td class="actions">'+
          '<button class="btn secondary small" data-edit="'+esc(d.id)+'">수정</button> '+
          '<button class="btn secondary small" data-del="'+esc(d.id)+'">삭제</button>'+
        '</td>';
      txBody.appendChild(tr);
    });

    var catTotals = {};
    monthItems.forEach(function(d){
      if(d.type !== 'expense') return;
      catTotals[d.category] = (catTotals[d.category] || 0) + d.amount;
    });
    var catEntries = Object.keys(catTotals).map(function(k){ return [k, catTotals[k]]; })
                           .sort(function(a,b){ return b[1]-a[1]; });
    var maxVal = catEntries.length ? catEntries[0][1] : 0;
    catSummaryEl.innerHTML = catEntries.length ? catEntries.map(function(entry, i){
      var pct = maxVal ? Math.round(entry[1]/maxVal*100) : 0;
      var share = totalExpense ? Math.round(entry[1]/totalExpense*100) : 0;
      var c1 = CAT_COLORS[i % CAT_COLORS.length];
      var c2 = CAT_COLORS[(i+3) % CAT_COLORS.length];
      return '<div class="cat-row">'+
        '<div class="name">'+esc(entry[0])+'</div>'+
        '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,'+c1+','+c2+')"></div></div>'+
        '<div class="pct">'+share+'%</div>'+
        '<div class="amt">'+fmtMoney(entry[1])+'</div>'+
      '</div>';
    }).join('') : '<div class="empty" style="padding:10px 0;">지출 내역이 없습니다.</div>';
  }

  txBody.addEventListener('click', function(e){
    var editBtn = e.target.closest('button[data-edit]');
    var delBtn = e.target.closest('button[data-del]');
    if(editBtn) startEdit(editBtn.getAttribute('data-edit'));
    if(delBtn) deleteItem(delBtn.getAttribute('data-del'));
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '가계부_백업_'+todayStr()+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  var importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', function(){
    importFile.click();
  });
  importFile.addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var imported = JSON.parse(evt.target.result);
        if(!Array.isArray(imported)) throw new Error('invalid');
        var mode = confirm('기존 데이터에 추가하려면 확인, 전체 교체하려면 취소를 누르세요.');
        if(mode){
          data = data.concat(imported);
        } else {
          data = imported;
        }
        saveData(data);
        render();
        alert('불러오기가 완료되었습니다.');
      }catch(err){
        alert('올바른 백업 파일이 아닙니다.');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  dateInput.value = todayStr();
  refreshCategoryOptions();
  render();
})();
</script>
</body>
</html>
