<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 가계부</title>
<style>
  :root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#e5e7eb;
    --income:#2563eb;
    --expense:#dc2626;
    --accent:#0f172a;
    --accent-hover:#1e293b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 20px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:16px;
  }
  .month-nav button{
    background:none;
    border:1px solid var(--border);
    border-radius:8px;
    width:34px;height:34px;
    cursor:pointer;
    font-size:16px;
  }
  .month-nav .month-label{font-size:18px;font-weight:700;min-width:110px;text-align:center;}

  .summary{display:flex;gap:12px;flex-wrap:wrap;}
  .summary .box{
    flex:1;
    min-width:140px;
    background:#fafafa;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
  }
  .summary .box .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .summary .box .value{font-size:19px;font-weight:700;}
  .summary .box.income .value{color:var(--income);}
  .summary .box.expense .value{color:var(--expense);}

  form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--muted);}
  .field input, .field select{
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    background:#fff;
    color:var(--text);
  }
  .field.memo{flex:1;min-width:160px;}
  .field.amount input{width:130px;}
  .type-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .type-toggle button{
    padding:9px 14px;
    border:none;
    background:#fff;
    cursor:pointer;
    font-size:13px;
    color:var(--muted);
  }
  .type-toggle button.active[data-type="expense"]{background:var(--expense);color:#fff;}
  .type-toggle button.active[data-type="income"]{background:var(--income);color:#fff;}

  .btn{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    font-size:14px;
  }
  .btn:hover{background:var(--accent-hover);}
  .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn.small{padding:6px 10px;font-size:12px;}

  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;margin-top:6px;min-width:520px;}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);font-size:14px;white-space:nowrap;}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  td.memo{white-space:normal;word-break:break-word;max-width:220px;}
  td.amount{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  tr.income td.amount{color:var(--income);}
  tr.expense td.amount{color:var(--expense);}
  td.actions{text-align:right;white-space:nowrap;}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px;}

  .cat-summary{display:flex;flex-direction:column;gap:8px;}
  .cat-row{display:flex;align-items:center;gap:10px;font-size:13px;}
  .cat-row .name{width:90px;flex-shrink:0;color:var(--muted);}
  .cat-row .bar-bg{flex:1;background:#eef0f2;border-radius:6px;height:10px;overflow:hidden;}
  .cat-row .bar-fill{height:100%;background:var(--expense);border-radius:6px;}
  .cat-row .amt{width:100px;text-align:right;flex-shrink:0;}

  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .file-actions{display:flex;gap:8px;}
  #importFile{display:none;}
  .section-title{font-size:14px;font-weight:700;margin:0 0 12px;color:var(--text);}
  .warning-banner{
    display:none;
    background:#fef3c7;
    border:1px solid #fcd34d;
    color:#92400e;
    padding:10px 14px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="warning-banner" id="storageWarning">
    이 브라우저 환경에서는 자동 저장이 되지 않습니다. 작업 내용은 "JSON 내보내기"로 꼭 백업해 주세요.
  </div>
  <div class="top-actions">
    <h1>나의 가계부</h1>
    <div class="file-actions">
      <button class="btn secondary small" id="exportBtn">JSON 내보내기</button>
      <button class="btn secondary small" id="importBtn">JSON 불러오기</button>
      <input type="file" id="importFile" accept="application/json">
    </div>
  </div>

  <div class="card">
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth">›</button>
    </div>
    <div class="summary">
      <div class="box income">
        <div class="label">이번 달 수입</div>
        <div class="value" id="totalIncome">0원</div>
      </div>
      <div class="box expense">
        <div class="label">이번 달 지출</div>
        <div class="value" id="totalExpense">0원</div>
      </div>
      <div class="box">
        <div class="label">잔액</div>
        <div class="value" id="totalBalance">0원</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" id="formTitle">내역 추가</div>
    <form id="txForm">
      <div class="field">
        <label>구분</label>
        <div class="type-toggle">
          <button type="button" data-type="expense" class="active">지출</button>
          <button type="button" data-type="income">수입</button>
        </div>
      </div>
      <div class="field">
        <label>날짜</label>
        <input type="date" id="txDate" required>
      </div>
      <div class="field">
        <label>카테고리</label>
        <select id="txCategory"></select>
      </div>
      <div class="field memo">
        <label>내용</label>
        <input type="text" id="txMemo" placeholder="예: 점심 식사">
      </div>
      <div class="field amount">
        <label>금액</label>
        <input type="number" id="txAmount" min="0" step="1" placeholder="0" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">추가</button>
      <button type="button" class="btn secondary" id="cancelEditBtn" style="display:none;">취소</button>
    </form>
  </div>

  <div class="card">
    <div class="section-title">지출 카테고리별 합계</div>
    <div class="cat-summary" id="catSummary"></div>
  </div>

  <div class="card">
    <div class="section-title">이번 달 내역</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>날짜</th><th>구분</th><th>카테고리</th><th>내용</th><th style="text-align:right;">금액</th><th></th></tr>
        </thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyMsg" style="display:none;">등록된 내역이 없습니다.</div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'ggb_transactions_v1';
  var CATEGORIES = {
    income: ['급여','용돈','상여','이자/배당','기타수입'],
    expense: ['식비','교통비','주거/관리비','통신비','의료/건강','문화/여가','교육','쇼핑','경조사','기타지출']
  };

  var state = {
    currentType: 'expense',
    editingId: null,
    viewDate: new Date()
  };

  var storageOk = true;
  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      storageOk = false;
      return [];
    }
  }
  function saveData(list){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }catch(e){
      storageOk = false;
    }
    if(!storageOk){
      document.getElementById('storageWarning').style.display = 'block';
    }
  }
  var data = loadData();
  if(!storageOk){
    document.getElementById('storageWarning').style.display = 'block';
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }
  function fmtMoney(n){
    return Number(n).toLocaleString('ko-KR') + '원';
  }
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function monthKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
  function ymdOf(dateStr){ return dateStr.slice(0,7); }

  var typeToggleEl = document.querySelector('.type-toggle');
  var categorySelect = document.getElementById('txCategory');
  var dateInput = document.getElementById('txDate');
  var memoInput = document.getElementById('txMemo');
  var amountInput = document.getElementById('txAmount');
  var form = document.getElementById('txForm');
  var submitBtn = document.getElementById('submitBtn');
  var cancelEditBtn = document.getElementById('cancelEditBtn');
  var formTitle = document.getElementById('formTitle');

  function refreshCategoryOptions(){
    var list = CATEGORIES[state.currentType];
    categorySelect.innerHTML = list.map(function(c){
      return '<option value="'+c+'">'+c+'</option>';
    }).join('');
  }

  typeToggleEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-type]');
    if(!btn) return;
    state.currentType = btn.getAttribute('data-type');
    Array.prototype.forEach.call(typeToggleEl.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b === btn);
    });
    refreshCategoryOptions();
  });

  function resetForm(){
    state.editingId = null;
    form.reset();
    dateInput.value = new Date().toISOString().slice(0,10);
    state.currentType = 'expense';
    Array.prototype.forEach.call(typeToggleEl.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.getAttribute('data-type') === 'expense');
    });
    refreshCategoryOptions();
    submitBtn.textContent = '추가';
    formTitle.textContent = '내역 추가';
    cancelEditBtn.style.display = 'none';
  }

  cancelEditBtn.addEventListener('click', resetForm);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var amount = Number(amountInput.value);
    if(!dateInput.value || !amount || amount <= 0){
      alert('날짜와 올바른 금액을 입력해 주세요.');
      return;
    }
    if(state.editingId){
      var item = data.find(function(d){ return d.id === state.editingId; });
      if(item){
        item.date = dateInput.value;
        item.type = state.currentType;
        item.category = categorySelect.value;
        item.memo = memoInput.value.trim();
        item.amount = amount;
      }
    } else {
      data.push({
        id: uid(),
        date: dateInput.value,
        type: state.currentType,
        category: categorySelect.value,
        memo: memoInput.value.trim(),
        amount: amount
      });
    }
    saveData(data);
    resetForm();
    render();
  });

  function startEdit(id){
    var item = data.find(function(d){ return d.id === id; });
    if(!item) return;
    state.editingId = id;
    state.currentType = item.type;
    Array.prototype.forEach.call(typeToggleEl.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.getAttribute('data-type') === item.type);
    });
    refreshCategoryOptions();
    dateInput.value = item.date;
    categorySelect.value = item.category;
    memoInput.value = item.memo || '';
    amountInput.value = item.amount;
    submitBtn.textContent = '수정 완료';
    formTitle.textContent = '내역 수정';
    cancelEditBtn.style.display = 'inline-block';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function deleteItem(id){
    if(!confirm('이 내역을 삭제할까요?')) return;
    data = data.filter(function(d){ return d.id !== id; });
    saveData(data);
    if(state.editingId === id) resetForm();
    render();
  }

  document.getElementById('prevMonth').addEventListener('click', function(){
    state.viewDate.setMonth(state.viewDate.getMonth() - 1);
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    state.viewDate.setMonth(state.viewDate.getMonth() + 1);
    render();
  });

  var txBody = document.getElementById('txBody');
  var emptyMsg = document.getElementById('emptyMsg');
  var monthLabel = document.getElementById('monthLabel');
  var catSummaryEl = document.getElementById('catSummary');

  function render(){
    var mk = monthKey(state.viewDate);
    monthLabel.textContent = state.viewDate.getFullYear() + '년 ' + (state.viewDate.getMonth()+1) + '월';

    var monthItems = data.filter(function(d){ return ymdOf(d.date) === mk; })
                          .sort(function(a,b){ return b.date.localeCompare(a.date); });

    var totalIncome = 0, totalExpense = 0;
    monthItems.forEach(function(d){
      if(d.type === 'income') totalIncome += d.amount;
      else totalExpense += d.amount;
    });
    document.getElementById('totalIncome').textContent = fmtMoney(totalIncome);
    document.getElementById('totalExpense').textContent = fmtMoney(totalExpense);
    document.getElementById('totalBalance').textContent = fmtMoney(totalIncome - totalExpense);

    txBody.innerHTML = '';
    emptyMsg.style.display = monthItems.length ? 'none' : 'block';
    monthItems.forEach(function(d){
      var tr = document.createElement('tr');
      tr.className = d.type;
      tr.innerHTML =
        '<td>'+d.date+'</td>'+
        '<td>'+(d.type==='income' ? '수입' : '지출')+'</td>'+
        '<td>'+d.category+'</td>'+
        '<td class="memo">'+(d.memo || '-')+'</td>'+
        '<td class="amount">'+(d.type==='income'?'+':'-')+fmtMoney(d.amount)+'</td>'+
        '<td class="actions">'+
          '<button class="btn secondary small" data-edit="'+d.id+'">수정</button> '+
          '<button class="btn secondary small" data-del="'+d.id+'">삭제</button>'+
        '</td>';
      txBody.appendChild(tr);
    });

    var catTotals = {};
    monthItems.forEach(function(d){
      if(d.type !== 'expense') return;
      catTotals[d.category] = (catTotals[d.category] || 0) + d.amount;
    });
    var catEntries = Object.keys(catTotals).map(function(k){ return [k, catTotals[k]]; })
                            .sort(function(a,b){ return b[1]-a[1]; });
    var maxVal = catEntries.length ? catEntries[0][1] : 0;
    catSummaryEl.innerHTML = catEntries.length ? catEntries.map(function(entry){
      var pct = maxVal ? Math.round(entry[1]/maxVal*100) : 0;
      return '<div class="cat-row">'+
        '<div class="name">'+entry[0]+'</div>'+
        '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
        '<div class="amt">'+fmtMoney(entry[1])+'</div>'+
      '</div>';
    }).join('') : '<div class="empty" style="padding:10px 0;">지출 내역이 없습니다.</div>';
  }

  txBody.addEventListener('click', function(e){
    var editBtn = e.target.closest('button[data-edit]');
    var delBtn = e.target.closest('button[data-del]');
    if(editBtn) startEdit(editBtn.getAttribute('data-edit'));
    if(delBtn) deleteItem(delBtn.getAttribute('data-del'));
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var today = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = '가계부_백업_'+today+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  var importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', function(){
    importFile.click();
  });
  importFile.addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var imported = JSON.parse(evt.target.result);
        if(!Array.isArray(imported)) throw new Error('invalid');
        var mode = confirm('기존 데이터에 추가하려면 확인, 전체 교체하려면 취소를 누르세요.');
        if(mode){
          data = data.concat(imported);
        } else {
          data = imported;
        }
        saveData(data);
        render();
        alert('불러오기가 완료되었습니다.');
      }catch(err){
        alert('올바른 백업 파일이 아닙니다.');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  dateInput.value = new Date().toISOString().slice(0,10);
  refreshCategoryOptions();
  render();
})();
</script>
</body>
</html>
